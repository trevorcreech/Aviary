# Aviary -> Fraimic local API. The Fraimic stays paired to its cloud dashboard.
base_url = "http://aviary.local"
fraimic_url = "http://fraimic.local"

# Physical mounting: "portrait" or "landscape". Landscape assumes a left turn,
# with the frame's original bottom edge on the right.
orientation = "portrait"

# Show the rolling last 24 hours.
hours = 24
shoot_title = "Aviary"
shoot_subtitle = "Heard Today"
# Set both titles to "" for a full-panel, birds-only composition.
shoot_collage_vh = 52
# Visually enlarge the bird cluster without changing the title layout.
shoot_collage_scale = 1.0
timeout = 180

# Check on the hour, but redraw only when the bird signature changes (or
# for the daily healing refresh).
quiet_start = 0
quiet_end = 0
heal_hours = 24
state = "~/.birdframe/fraimic-state.json"
cache = "~/.birdframe"
